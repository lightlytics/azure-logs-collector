name: Collectors Tests

on:
  push:
    paths:
      - 'network-traffic/**'
      - 'storage-logs/**'
      - 'file-collector/**'
      - 'collectors-tests.yml'
  pull_request:
    paths:
      - 'network-traffic/**'
      - 'storage-logs/**'
      - 'file-collector/**'
      - 'collectors-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.project.display }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: network-traffic
            display: Network Traffic
            lock: network-traffic/package-lock.json
          - name: storage-logs
            display: Storage Logs
            lock: storage-logs/package-lock.json
    defaults:
      run:
        working-directory: ${{ matrix.project.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project.lock }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run tests
        run: npm test -- --ci --runInBand
